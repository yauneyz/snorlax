appId: com.talysman.app
productName: Talysman
copyright: Copyright © 2026
forceCodeSigning: true
electronUpdaterCompatibility: ">= 2.16"
# Chromium otherwise ships dozens of locale packs that this English-only UI never loads.
electronLanguages:
  - en-US
protocols:
  - name: Talysman authentication and billing callbacks
    schemes:
      - talysman

directories:
  output: dist
  # Brand assets live in assets/brand (source SVGs + committed rasters); see its README to
  # regenerate. Each platform below points at the pre-built icon for its own format.
  buildResources: assets/brand/generated

extraMetadata:
  main: apps/desktop/out/main/index.cjs

files:
  - apps/desktop/out/**/*
  - package.json

# Runtime brand images shared by every platform. Native binaries are configured under each
# platform below so packaging never depends on the mutable resources/bin/current directory.
extraResources:
  # `files:` only ships apps/desktop/out, so without this the tray and the
  # window icon resolve to nothing in a packaged build. tray.ts looks them up flat under
  # process.resourcesPath, so they land at the resources root.
  - from: apps/desktop/resources
    to: .
    filter:
      - "*.png"

win:
  target:
    - nsis
  icon: assets/brand/generated/windows/icon.ico
  extraResources:
    - from: apps/desktop/resources/bin/win
      to: bin
      filter:
        - talysman-svc.exe
        - talysman-svcctl.exe
        - talysman-natmsg.exe
        - WinDivert.dll
        - WinDivert64.sys
  # Release builds fail closed when Authenticode credentials are unavailable.

# electron-builder's own Windows signing pass never walks resources/bin (see
# scripts/sign-windows-native-binaries.mjs for why), so the native service binaries staged there
# would otherwise ship unsigned even in an Authenticode-signed installer. Windows-only; no-ops
# on other platforms.
afterPack: scripts/sign-windows-native-binaries.mjs

nsis:
  installerIcon: assets/brand/generated/windows/icon.ico
  uninstallerIcon: assets/brand/generated/windows/icon.ico
  installerHeaderIcon: assets/brand/generated/windows/icon.ico
  oneClick: false
  perMachine: true # service install needs machine scope + elevation
  allowElevation: true
  allowToChangeInstallationDirectory: true
  include: native/windows/installer/nsis-include.nsh
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

mac:
  # One universal dmg runs natively on Apple Silicon and Intel, so the website never has to guess
  # a visitor's CPU (Safari reports "Intel" on every Mac). The zip is the electron-updater payload.
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  # scripts/build-native.mjs stages these already-fat (lipo'd) binaries into both per-arch builds,
  # so @electron/universal sees identical Mach-O files and must be told to keep them as-is.
  x64ArchFiles: "Contents/Resources/bin/talysman-*"
  icon: assets/brand/generated/macos/icon.icns
  extraResources:
    - from: apps/desktop/resources/bin/mac
      to: bin
      filter:
        - talysman-svc
        - talysman-svcctl
        - talysman-natmsg
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  # electron-builder's own notarize+staple runs *before* the afterSign hook below, but afterSign
  # still needs to re-sign the outer app afterward (see its comment) -- re-signing after a staple
  # orphans the ticket, so notarize is disabled here and afterSign does it itself, last.
  notarize: false
  # A DMG has no install hooks; the app requests administrator approval on first run and after a
  # service-version change, then verifies the restarted LaunchDaemon.

# electron-builder signs the app bundle plus the Electron helpers/frameworks it knows about, but
# never discovers the talysman-svc/svcctl/natmsg binaries staged into
# Contents/Resources/bin by scripts/build-native.mjs (extraResources above). Apple's notary
# service rejects the whole bundle over those unsigned nested executables, so afterSign signs
# them explicitly, folds the change back into the outer app's seal, and only then notarizes and
# staples (see its comment for why that order matters). Mac-only; no-ops elsewhere.
afterSign: scripts/after-sign.mjs

linux:
  # deb (Debian/Ubuntu/Mint/Pop), rpm (Fedora/RHEL/openSUSE) and pacman (Arch/Manjaro/EndeavourOS)
  # are public. AppImage is only built for release:local (scripts/build.mjs --linux-targets).
  target:
    - deb
    - rpm
    - pacman
  # A directory of NxN.png files: electron-builder installs each into the matching
  # hicolor icon theme size so desktop environments pick the right one.
  icon: assets/brand/generated/linux
  extraResources:
    - from: apps/desktop/resources/bin/linux
      to: bin
      filter:
        - talysman-svc
        - talysman-svcctl
        - talysman-natmsg
        - after-install.sh
        - before-remove.sh
        - after-remove.sh
  syncDesktopName: true
  category: Utility
  maintainer: Talysman <support@talysman.app>
  artifactName: ${productName}-${version}-${arch}.${ext}

# deb, rpm and pacman are the PUBLIC Linux artifacts (uploaded by scripts/upload-release.mjs
# and served by /download). Each ships the privileged daemon and installs it from the shared
# hooks in native/linux/installer, which branch on each package manager's upgrade arguments.
# The AppImage is local-only: release-local.mjs stages it for the NixOS install (wrapped via
# appimageTools in nixos-config), where the daemon is built from source and started by a
# declarative systemd unit instead.
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

deb:
  afterInstall: native/linux/installer/after-install.sh
  afterRemove: native/linux/installer/after-remove.sh
  fpm:
    - --depends=nftables
    - --depends=systemd
    - --depends=dnsmasq
    - --before-remove=native/linux/installer/before-remove.sh

# electron-updater's RpmUpdater/PacmanUpdater keep these current (no dnf/pacman repo to host);
# the deb stays on the signed APT repository.
rpm:
  afterInstall: native/linux/installer/after-install.sh
  afterRemove: native/linux/installer/after-remove.sh
  fpm:
    - --depends=nftables
    - --depends=systemd
    - --depends=dnsmasq
    - --before-remove=native/linux/installer/before-remove.sh

pacman:
  afterInstall: native/linux/installer/after-install.sh
  afterRemove: native/linux/installer/after-remove.sh
  # electron-builder's default pacman depends name packages Arch has since dropped
  # (http-parser, libappindicator-gtk3), which makes `pacman -U` refuse the package outright.
  depends:
    - gtk3
    - nss
    - alsa-lib
    - libxss
    - libxtst
    - libnotify
    - libsecret
    - xdg-utils
    - at-spi2-core
    - util-linux-libs
    - nftables
    - systemd
    - dnsmasq
  fpm:
    - --before-remove=native/linux/installer/before-remove.sh
    # pacman runs no install hook on upgrade unless asked; re-running the install hook is how the
    # daemon picks up the new binary (svcctl install restarts an existing unit).
    - --after-upgrade=native/linux/installer/after-install.sh

publish:
  provider: generic
  # scripts/build.mjs loads this public base URL from the generated production env. Platform and
  # architecture directories prevent metadata collisions when release jobs run independently.
  url: ${env.UPDATE_FEED_URL}/${os}/${arch}
  # S3 supports byte ranges but not multipart ranges in one request.
  useMultipleRangeRequest: false
