[package]
name = "talysman_engine_wasm"
version = "0.7.0"
edition = "2021"
description = "wasm-bindgen facade over talysman_engine for TypeScript (desktop mock service, parity tests)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No premade lists: TypeScript consumers never make network-level decisions.
talysman_engine = { path = "../engine", default-features = false }
serde = "1"
serde_json = "1"
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
