[package]
name = "talysman_engine_ffi"
version = "0.7.0"
edition = "2021"
description = "uniffi (Kotlin) facade over talysman_engine for Talysman for Android."
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "talysman_engine_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# Premade lists only ship with the optional VPN DNS sinkhole (spec §6.2).
talysman_engine = { path = "../engine", default-features = false }
# The extension state frame (shared with the desktop native-messaging hosts).
talysman_common = { path = "../common" }
serde = "1"
serde_json = "1"
uniffi = { version = "0.29", features = ["cli"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
