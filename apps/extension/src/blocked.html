<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Website blocked by Talysman</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main>
      <section class="blocked-card" aria-labelledby="blocked-title">
        <header class="brand">
          <img src="blocked-logo.svg" alt="" width="48" height="48" />
          <span>Talysman</span>
        </header>

        <div class="divider"></div>

        <h1 id="blocked-title">Website blocked</h1>
        <p id="blocked-summary">This website was blocked by Talysman.</p>
        <p class="detail">Blocking is controlled by your current setup in the Talysman desktop app.</p>
        <p class="detail" id="reason-detail" hidden></p>
        <form id="site-search" class="soft-search" method="get" hidden>
          <label id="site-search-label" for="site-query">Search for specific content</label>
          <div class="soft-search-row">
            <input id="site-query" name="q" type="search" required autocomplete="off" />
            <button type="submit">Search</button>
          </div>
        </form>
        <nav id="site-tools" class="soft-tools" aria-label="Available site tools" hidden></nav>
      </section>
    </main>
    <script src="site-catalog.js"></script>
    <script src="blocked.js"></script>
  </body>
</html>
