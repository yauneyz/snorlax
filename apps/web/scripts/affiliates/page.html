<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Talysman Affiliates</title>
    <style>
      /* PALETTE */
      :root {
        color-scheme: dark;
        --bg: rgb(var(--color-background));
        --panel: rgb(var(--color-panel));
        --raised: rgb(var(--color-panel-raised));
        --strong: rgb(var(--color-panel-strong));
        --border: rgb(var(--color-border));
        --fg: rgb(var(--color-foreground));
        --fg-strong: rgb(var(--color-foreground-strong));
        --muted: rgb(var(--color-foreground-muted));
        --dim: rgb(var(--color-foreground-dim));
        --signal: rgb(var(--color-signal));
        --signal-ink: rgb(var(--color-signal-ink));
        --success: rgb(var(--color-success-ink));
        --warning: rgb(var(--color-warning));
        --danger: rgb(var(--color-danger-ink));
        --mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }
      header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
      h1 { font-size: 20px; margin: 0; color: var(--fg-strong); letter-spacing: -0.01em; }
      h2 { font-size: 15px; margin: 0 0 12px; color: var(--fg-strong); }
      h3 { font-size: 13px; margin: 20px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
      .pill { font: 600 11px/1 var(--mono); padding: 5px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
      .pill.prod { color: var(--signal-ink); background: var(--signal); border-color: transparent; }
      .pill.off { color: var(--warning); border-color: currentColor; }
      .spacer { flex: 1; }
      section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
      th { font-weight: 500; color: var(--dim); font-size: 12px; }
      td.num, th.num { text-align: right; }
      tbody tr.row { cursor: pointer; }
      tbody tr.row:hover, tbody tr.row.selected { background: var(--raised); }
      .owed { color: var(--signal); font-weight: 600; }
      .neg { color: var(--danger); }
      .muted { color: var(--muted); }
      .dim { color: var(--dim); }
      .mono { font-family: var(--mono); font-size: 12px; }
      .err { color: var(--danger); }
      form.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 12px; align-items: end; }
      label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
      label.wide { grid-column: 1 / -1; }
      input, textarea, select {
        background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px;
        padding: 7px 9px; font: inherit;
      }
      textarea { min-height: 54px; resize: vertical; }
      input:focus, textarea:focus { outline: 1px solid var(--signal); border-color: transparent; }
      button {
        background: var(--strong); color: var(--fg-strong); border: 1px solid var(--border); border-radius: 6px;
        padding: 7px 12px; font: inherit; cursor: pointer;
      }
      button:hover { border-color: var(--muted); }
      button.primary { background: var(--signal); color: var(--signal-ink); border-color: transparent; font-weight: 600; }
      button.link { background: none; border: none; color: var(--muted); padding: 2px 4px; }
      button.link:hover { color: var(--fg-strong); }
      .row-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
      .toast { position: fixed; bottom: 16px; right: 16px; background: var(--strong); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
      .toast.show { opacity: 1; }
      details > summary { cursor: pointer; color: var(--fg-strong); font-weight: 600; }
      details[open] > summary { margin-bottom: 12px; }
      .note { color: var(--dim); font-size: 12px; margin-top: 10px; }
      .empty { color: var(--dim); padding: 16px 0; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Affiliates</h1>
        <span id="env" class="pill"></span>
        <span id="stripe" class="pill"></span>
        <span class="spacer"></span>
        <button id="refresh">Refresh</button>
      </header>

      <section>
        <details id="create-panel">
          <summary>New affiliate</summary>
          <form id="create" class="grid">
            <label>Slug (in the link, permanent)<input name="slug" required pattern="[a-z0-9][a-z0-9\-]{1,39}" placeholder="maya" /></label>
            <label>Name<input name="name" required placeholder="Maya Chen" /></label>
            <label>Contact<input name="contact" placeholder="email, handle…" /></label>
            <label>Landing path<input name="landing_path" value="/" /></label>
            <label>Commission %<input name="commission_pct" type="number" min="0" max="100" step="0.01" value="50" /></label>
            <label>Commission months<input name="commission_months" type="number" min="1" max="120" value="12" /></label>
            <label class="wide">Notes<textarea name="notes" placeholder="Terms agreed, payout method…"></textarea></label>
            <div class="row-actions"><button class="primary" type="submit">Create</button><span id="create-error" class="err"></span></div>
          </form>
        </details>
      </section>

      <section>
        <h2>Overview</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Affiliate</th><th>Link</th>
                <th class="num">Visitors</th><th class="num">Accounts</th><th class="num">Trials</th><th class="num">Customers</th>
                <th class="num">Revenue</th><th class="num">Commission</th><th class="num">Paid out</th><th class="num">Owed</th><th></th>
              </tr>
            </thead>
            <tbody id="overview"></tbody>
          </table>
        </div>
        <p class="note">
          Visitors are everyone who arrived through the link, all time (the Insights channel panel shows the
          last 90 days). Revenue is net Stripe charges inside each referral's commission window.
        </p>
      </section>

      <div id="detail"></div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
